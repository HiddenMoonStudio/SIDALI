<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Sidalu Ahmed Mebark — Cosmetics. A premium digital business card.">
  <title>Sidali Ahmed Mebark | Digital Business Card</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080909;
      --panel: rgba(20, 21, 22, .88);
      --silver: #d9dcdf;
      --muted: #a5a9ad;
      --line: rgba(215, 220, 224, .19);
      --line-strong: rgba(215, 220, 224, .38);
      --shadow: 0 24px 80px rgba(0,0,0,.52);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0; min-height: 100vh; padding: 28px 16px;
      display: grid; place-items: center;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(174,181,188,.12), transparent 42%),
        radial-gradient(ellipse at 100% 100%, rgba(130,136,142,.055), transparent 36%),
        linear-gradient(145deg, #080909 0%, #111213 48%, #070808 100%);
      color: #f3f4f5;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: min(100%, 490px); position: relative; overflow: hidden;
      padding: clamp(26px, 6vw, 46px);
      border: 1px solid var(--line-strong); border-radius: 28px;
      background: linear-gradient(145deg, rgba(29,30,31,.97), rgba(11,12,12,.98) 58%, rgba(20,21,22,.98));
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.06);
      animation: rise .7s cubic-bezier(.2,.75,.2,1) both;
    }
    .card::before {
      content: ""; position: absolute; inset: 0 12% auto; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(245,247,249,.8), transparent);
    }
    .card::after {
      content: ""; position: absolute; width: 240px; height: 240px; top: -145px; right: -100px;
      border: 1px solid rgba(220,225,230,.09); border-radius: 50%;
      box-shadow: 0 0 0 24px rgba(220,225,230,.018), 0 0 0 48px rgba(220,225,230,.012);
      pointer-events: none;
    }
    .eyebrow {
      display: flex; align-items: center; gap: 10px; color: #bfc3c7;
      font-size: .69rem; letter-spacing: .24em; text-transform: uppercase; font-weight: 700;
    }
    .eyebrow::before { content: ""; width: 24px; height: 1px; background: linear-gradient(90deg, #fff, #777); }
    h1 {
      margin: 28px 0 10px; max-width: 100%;
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      font-weight: 500; letter-spacing: -.045em; line-height: 1.04;
      font-size: clamp(2.35rem, 8vw, 3.55rem);
      overflow-wrap: anywhere;
      background: linear-gradient(115deg, #fff 5%, #c7cbcf 48%, #858b91 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .title { color: #e0e2e4; text-transform: uppercase; letter-spacing: .19em; font-size: .78rem; font-weight: 650; }
    .location { margin-top: 13px; display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .91rem; }
    .location svg { width: 16px; height: 16px; flex: 0 0 auto; }
    .rule { height: 1px; margin: 28px 0 22px; background: linear-gradient(90deg, var(--line-strong), var(--line), transparent); }
    .intro-label { margin: 0 0 9px; color: #aeb3b8; font-size: .68rem; text-transform: uppercase; letter-spacing: .2em; }
    .intro { margin: 0; color: #e3e5e7; font-size: 1rem; line-height: 1.8; }
    .socials { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 11px; margin-top: 27px; }
    .social {
      min-height: 58px; display: flex; align-items: center; gap: 13px;
      padding: 13px 15px; border: 1px solid var(--line); border-radius: 14px;
      background: linear-gradient(135deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
      color: #e7e9eb; text-decoration: none; font-size: .9rem; font-weight: 600;
      transition: transform .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .social svg { width: 22px; height: 22px; flex: 0 0 auto; color: #d6dade; }
    .social span { min-width: 0; overflow-wrap: anywhere; }
    .social:hover, .social:focus-visible {
      transform: translateY(-2px); border-color: rgba(232,236,240,.56);
      background: linear-gradient(135deg, rgba(255,255,255,.11), rgba(255,255,255,.035));
      box-shadow: 0 8px 22px rgba(0,0,0,.2); outline: none;
    }
    .social:active, .action:active { transform: scale(.98); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 24px; }
    .action {
      min-height: 51px; border-radius: 13px; border: 1px solid var(--line-strong);
      padding: 13px 12px; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      color: #111; background: linear-gradient(120deg, #f0f1f2, #b6bbc0);
      font: inherit; font-weight: 750; font-size: .88rem; cursor: pointer;
      transition: transform .2s ease, filter .2s ease, border-color .2s ease;
    }
    .action.secondary { color: #e8eaec; background: rgba(255,255,255,.035); }
    .action:hover, .action:focus-visible { filter: brightness(1.09); transform: translateY(-2px); outline: 2px solid #c9cdd1; outline-offset: 3px; }
    .action svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .foot { margin-top: 25px; text-align: center; color: #777d82; font-size: .68rem; letter-spacing: .15em; text-transform: uppercase; }
    .toast { min-height: 1.4em; margin: 12px 0 -8px; color: #d9dde0; text-align: center; font-size: .8rem; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 360px) {
      body { padding: 14px 10px; }
      .card { padding: 24px 18px; border-radius: 22px; }
      .socials { gap: 8px; }
      .social { padding: 12px 10px; gap: 9px; font-size: .82rem; }
      .actions { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

  <script>
    // Keep these details in sync with the visible text above.
    const contact = {
      name: "Sidalu Ahmed Mebark",
      title: "Cosmetics",
      location: "Attatba, Tipaza, Algeria",
      email: "sidaliah14@gmail.com",
      // Add a phone number here if desired, then add TEL;VALUE=uri:tel:+213... to the VCF below.
      phone: ""
    };

    const statusMessage = document.getElementById("status-message");
    function announce(message) {
      statusMessage.textContent = message;
    }

    // Create a standards-compatible vCard 3.0 contact file.
    document.getElementById("save-contact").addEventListener("click", () => {
      const safe = (value) => String(value).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
      const parts = contact.name.trim().split(/\s+/);
      const lastName = parts.length > 1 ? parts.pop() : "";
      const firstName = parts.join(" ");
      const lines = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `N:${safe(lastName)};${safe(firstName)};;;`,
        `FN:${safe(contact.name)}`,
        `TITLE:${safe(contact.title)}`,
        `ADR;TYPE=WORK:;;${safe(contact.location)};;;;`,
        `EMAIL;TYPE=INTERNET:${safe(contact.email)}`
      ];
      if (contact.phone) lines.push(`TEL;TYPE=CELL:${safe(contact.phone)}`);
      lines.push("END:VCARD");
      const blob = new Blob([lines.join("\r\n") + "\r\n"], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "Sidalu-Ahmed-Mebark.vcf";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      announce("Contact file downloaded.");
    });

    // Share the published page URL. On a local preview, copy/share will use the current file URL,
    // so publish to GitHub Pages first for a useful public link.
    document.getElementById("share-card").addEventListener("click", async () => {
      const shareData = {
        title: `${contact.name} — Digital Business Card`,
        text: `Connect with ${contact.name}.`,
        url: window.location.href
      };
      try {
        if (navigator.share) {
          await navigator.share(shareData);
          announce("Share menu opened.");
          return;
        }
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(shareData.url);
          announce("Card link copied to clipboard.");
          return;
        }
        // Clipboard API fallback for older browsers and local previews.
        const field = document.createElement("textarea");
        field.value = shareData.url;
        field.setAttribute("readonly", "");
        field.style.position = "fixed";
        field.style.opacity = "0";
        document.body.appendChild(field);
        field.select();
        const copied = document.execCommand("copy");
        field.remove();
        announce(copied ? "Card link copied to clipboard." : "Copy this page URL from your browser address bar.");
      } catch (error) {
        if (error && error.name === "AbortError") {
          announce("Sharing cancelled.");
        } else {
          announce("Unable to share automatically. Copy the page URL from your browser.");
        }
      }
    });
  </script>
